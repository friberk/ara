[project]
name = "ai-research-assistant-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "anyio>=4,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "httpx>=0.28,<1",
  "dramatiq[redis,watch]>=1.17,<3",
  "pymupdf==1.28.2",
  "openai>=2,<3",
  "minio>=7.2,<8",
  "python-multipart>=0.0.20,<1",
  "pymupdf4llm==1.28.2",
  "pymupdf-layout==1.28.2",
  "llama-index-core>=0.14,<0.15",
  "llama-index-embeddings-openai>=0.7.0",
  "llama-index-embeddings-ollama>=0.10.0",
  "tiktoken>=0.9,<1",
  "pgvector>=0.4,<0.5",
]
[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires explicitly configured real PostgreSQL, Redis, MinIO",
    "open_models: runs with EXPERIMENTAL_OPEN_MODELS on (ARA-090)",
]
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
