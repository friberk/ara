name: ara

x-backend: &backend
  image: ara-backend:development
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  init: true
  working_dir: /app
  environment: &backend-env
    APP_ENV: ${APP_ENV:-development}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ara}:${POSTGRES_PASSWORD:?Run python3 scripts/bootstrap.py}@postgres:5432/${POSTGRES_DB:-ara}
    REDIS_URL: redis://:${REDIS_PASSWORD:?Run python3 scripts/bootstrap.py}@redis:6379/0
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-ara-local}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Run python3 scripts/bootstrap.py}
    MINIO_BUCKET: ${MINIO_BUCKET:-research-pdfs}
    MINIO_SECURE: "false"
    CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-5.6-luna}
    DEFAULT_REASONING_EFFORT: ${DEFAULT_REASONING_EFFORT:-low}
    LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-5}
    UV_PROJECT_ENVIRONMENT: /opt/venv
    WATCHFILES_FORCE_POLLING: "true"
  volumes:
    - ./src/backend:/app
  stop_grace_period: 30s
  mem_limit: 1g
  cpus: 2

services:
  postgres:
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ara}
      POSTGRES_DB: ${POSTGRES_DB:-ara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/bootstrap.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 2

  redis:
    image: redis:8.2.4-bookworm@sha256:320e9ce6d5c940815a84d989f0e53e3a4d065c0d9132cd9e1222265e78eb6080
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run python3 scripts/bootstrap.py}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 384m
    cpus: 1

  minio:
    image: ara-minio:7aac2a2c5b7c
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ara-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run python3 scripts/bootstrap.py}
      MINIO_BROWSER: "off"
      MINIO_UPDATE: "off"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/minio/health/ready', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 2

  migrate:
    <<: *backend
    command: ["uv", "run", "--frozen", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  storage-init:
    <<: *backend
    command: ["uv", "run", "--frozen", "python", "-m", "app.core.storage_init"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: ["uv", "run", "--frozen", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["uv", "run", "--frozen", "dramatiq", "app.jobs.actors", "--processes", "1", "--threads", "2", "--watch", "app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g

  frontend:
    image: ara-frontend:development
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    init: true
    environment:
      API_PROXY_TARGET: http://api:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./src/frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 1g
    cpus: 2

volumes:
  postgres-data:
  redis-data:
  minio-data:
  frontend-node-modules:
