name: ara

x-backend: &backend
  image: ara-backend:development
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  init: true
  working_dir: /app
  environment: &backend-env
    APP_ENV: ${APP_ENV:-development}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ara}:${POSTGRES_PASSWORD:?Run python3 scripts/bootstrap.py}@postgres:5432/${POSTGRES_DB:-ara}
    REDIS_URL: redis://:${REDIS_PASSWORD:?Run python3 scripts/bootstrap.py}@redis:6379/0
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-ara-local}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Run python3 scripts/bootstrap.py}
    MINIO_BUCKET: ${MINIO_BUCKET:-research-pdfs}
    MINIO_SECURE: "false"
    CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    FULLTEXT_ALLOWED_HOSTS: ${FULLTEXT_ALLOWED_HOSTS:-["arxiv.org","export.arxiv.org","aclanthology.org","pmc.ncbi.nlm.nih.gov","europepmc.org","proceedings.neurips.cc","openaccess.thecvf.com","pdfs.semanticscholar.org","link.springer.com","www.nature.com","nature.com","static-content.springer-cdn.com","ieeexplore.ieee.org","dl.acm.org"]}
    DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-5.6-luna}
    DEFAULT_REASONING_EFFORT: ${DEFAULT_REASONING_EFFORT:-low}
    LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-5}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    OLLAMA_CONTEXT_WINDOW: ${OLLAMA_CONTEXT_WINDOW:-8192}
    OLLAMA_NUM_THREADS: ${OLLAMA_NUM_THREADS:-4}
    OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-2048}
    OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-900}
    OLLAMA_PULL_TIMEOUT_SECONDS: ${OLLAMA_PULL_TIMEOUT_SECONDS:-21600}
    OLLAMA_STALL_SECONDS: ${OLLAMA_STALL_SECONDS:-120}
    # Context budgets in real tokens (ARA-076).
    LOCAL_INPUT_BUDGET_TOKENS: ${LOCAL_INPUT_BUDGET_TOKENS:-3072}
    OLLAMA_THINKING_TOKENS: ${OLLAMA_THINKING_TOKENS:-1024}
    LOCAL_TOKEN_FACTOR: ${LOCAL_TOKEN_FACTOR:-1.05}
    HOSTED_WORKING_CONTEXT_TOKENS: ${HOSTED_WORKING_CONTEXT_TOKENS:-64000}
    # Start summarizing older turns once they fill this share of the recent-turn budget (ARA-077).
    MEMORY_COMPACTION_RATIO: ${MEMORY_COMPACTION_RATIO:-0.6}
    UV_PROJECT_ENVIRONMENT: /opt/venv
    WATCHFILES_FORCE_POLLING: "true"
  volumes:
    - ./src/backend:/app
  stop_grace_period: 30s
  mem_limit: 1g
  cpus: 2

services:
  postgres:
    # pgvector 0.8.7 on PostgreSQL 17.11 with the same Debian 12 glibc/ICU as the former 17.9
    # image; an existing volume starts unchanged (verified in the ARA-070 Phase 0 spike).
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ara}
      POSTGRES_DB: ${POSTGRES_DB:-ara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/bootstrap.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 2

  redis:
    image: redis:8.2.4-bookworm@sha256:320e9ce6d5c940815a84d989f0e53e3a4d065c0d9132cd9e1222265e78eb6080
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run python3 scripts/bootstrap.py}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 384m
    cpus: 1

  minio:
    image: ara-minio:7aac2a2c5b7c
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ara-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run python3 scripts/bootstrap.py}
      MINIO_BROWSER: "off"
      MINIO_UPDATE: "off"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/minio/health/ready', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 2

  migrate:
    <<: *backend
    command: ["uv", "run", "--frozen", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  storage-init:
    <<: *backend
    command: ["uv", "run", "--frozen", "python", "-m", "app.core.storage_init"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: ["uv", "run", "--frozen", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["uv", "run", "--frozen", "python", "-m", "app.jobs.development_worker", "app.jobs.actors", "--queues", "default", "--processes", "1", "--threads", "2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g

  # Independent of core readiness: no weights are fetched or loaded on startup.
  ollama:
    image: ara-ollama:0.40.1-ara.2
    build:
      context: .
      dockerfile: docker/ollama.Dockerfile
      target: runtime
      args:
        BUILD_JOBS: ${OLLAMA_BUILD_JOBS:-2}
    init: true
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NOPRUNE: "true"
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_WINDOW:-8192}
      # Chat model, embedder and reranker stay resident together (ARA-070 Phase 0 S1).
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-3}
      # The llama-server prompt cache grows ~265 MiB per new prompt up to 8 GiB; disable it.
      LLAMA_ARG_CACHE_RAM: "0"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 2m
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:11434/api/ara/capabilities"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-12g}
    # No extra swap: overload must fail visibly instead of silently swapping.
    memswap_limit: ${OLLAMA_MEMORY_LIMIT:-12g}
    cpus: ${OLLAMA_CPUS:-4}

  model-worker:
    <<: *backend
    command: ["uv", "run", "--frozen", "python", "-m", "app.jobs.development_worker", "app.jobs.model_actors", "--queues", "local-models", "local-generation", "--processes", "1", "--threads", "2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g

  frontend:
    image: ara-frontend:development
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    init: true
    environment:
      API_PROXY_TARGET: http://api:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./src/frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 1g
    cpus: 2

volumes:
  postgres-data:
  redis-data:
  minio-data:
  frontend-node-modules:
  ollama-models:
