name: Verify research assistant
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer run on the same ref replaces an older one; main is never cancelled mid-deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.10.8'
      - name: Bootstrap private test configuration
        run: python3 scripts/bootstrap.py
      - name: Backend and real-service integration
        run: python3 scripts/test-stack.py test
      - name: Infrastructure acceptance checks
        run: python3 -m unittest discover -s tests/infrastructure -v
      - name: Frontend checks and build
        working-directory: src/frontend
        run: |
          npm ci
          npm run check
          npm run build
      - name: Create synthetic paper fixtures
        run: |
          uv run --with pymupdf==1.26.7 python tests/fixtures/create_pdf.py /tmp/ara-fixtures/research.pdf
          uv run --with pymupdf==1.26.7 python tests/fixtures/create_pdf.py --second /tmp/ara-fixtures/second.pdf
      - name: Start deterministic browser stack
        run: docker compose -p ara-e2e -f compose.yaml -f compose.test.yaml -f compose.e2e.yaml up --build -d --wait
      - name: Check generated API contract
        working-directory: src/frontend
        run: |
          ara_generated_contract="$(mktemp)"
          npx openapi-typescript http://127.0.0.1:8001/openapi.json -o "$ara_generated_contract"
          cmp src/api/generated.ts "$ara_generated_contract"
      - name: Chromium browser checks
        working-directory: src/frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Show safe service logs on failure
        if: failure()
        run: docker compose -p ara-e2e -f compose.yaml -f compose.test.yaml -f compose.e2e.yaml logs --tail 100 api worker
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failure-evidence
          path: |
            src/frontend/test-results
            src/frontend/playwright-report
          retention-days: 7
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Load the deploy key and the server's host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Ship, rebuild and check health on the server
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          SITE_HOST: ${{ vars.SITE_HOST }}
        run: scripts/deploy.sh "$DEPLOY_TARGET"
      - name: Clients outside Purdue are refused
        env:
          SITE_HOST: ${{ vars.SITE_HOST }}
        run: test "$(curl -sS -o /dev/null -w '%{http_code}' "https://$SITE_HOST/")" = 403
